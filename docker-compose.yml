version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    volumes:
      - ./uploads:/app/uploads
      - ./renders:/app/renders
      - ./temp:/app/temp
    environment:
      - PORT=3001
      - UPLOAD_DIR=/app/uploads
      - RENDER_DIR=/app/renders
      - TEMP_DIR=/app/temp
      - WHISPERX_MODEL_SIZE=base
      - WHISPERX_DEVICE=cpu

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:3001
    depends_on:
      - backend
