services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        # Set to "true" to bundle WhisperX (large download, enables transcription of any song)
        INSTALL_WHISPERX: "false"
    ports:
      - "3001:3001"
    volumes:
      - lyricreel-data:/app/data
    environment:
      - CORS_ORIGINS=http://localhost:3000
      - WHISPERX_MODEL_SIZE=base
      - WHISPERX_DEVICE=cpu
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3001
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  lyricreel-data:
